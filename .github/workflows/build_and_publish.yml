name: Publish Docker Image to GHCR (Main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish
    runs-on: arc-runner-scale-set
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."zot.ns-7dpt7m5sy72p.svc.cluster.local:5000"]
              http = true

      - name: Log in to GitHub Container Registry
        if: vars.PUSH_GHCR != 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to dev Zot
        env:
          ZOT_DEV_USERNAME: ${{ secrets.ZOT_DEV_USERNAME }}
          ZOT_DEV_PASSWORD: ${{ secrets.ZOT_DEV_PASSWORD }}
        run: echo "$ZOT_DEV_PASSWORD" | docker login zot.ns-7dpt7m5sy72p.svc.cluster.local:5000 -u "$ZOT_DEV_USERNAME" --password-stdin

      - name: Generate image tags
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          SAFE_REF_NAME="$(echo "${GITHUB_REF_NAME}" | tr '/_' '-')"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_BASE="$(echo "$IMAGE_BASE" | tr '[A-Z]' '[a-z]')"
          IMAGE_TAG="${SAFE_REF_NAME}-${GITHUB_SHA}"
          LATEST_REF="latest-${SAFE_REF_NAME}"

          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_ref=${LATEST_REF}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.PUSH_GHCR != 'false' && format('{0}:{1}', steps.tag.outputs.image_base, steps.tag.outputs.image_tag) || '' }}
            ${{ vars.PUSH_GHCR != 'false' && format('{0}:{1}', steps.tag.outputs.image_base, steps.tag.outputs.latest_ref) || '' }}
            ${{ vars.PUSH_GHCR != 'false' && format('{0}:latest', steps.tag.outputs.image_base) || '' }}
            zot.ns-7dpt7m5sy72p.svc.cluster.local:5000/koinx-tech/hodor:${{ steps.tag.outputs.image_tag }}
            zot.ns-7dpt7m5sy72p.svc.cluster.local:5000/koinx-tech/hodor:${{ steps.tag.outputs.latest_ref }}
            zot.ns-7dpt7m5sy72p.svc.cluster.local:5000/koinx-tech/hodor:latest
          cache-from: type=registry,ref=zot.ns-7dpt7m5sy72p.svc.cluster.local:5000/koinx-tech/hodor:buildcache
          cache-to: type=registry,ref=zot.ns-7dpt7m5sy72p.svc.cluster.local:5000/koinx-tech/hodor:buildcache,mode=max
